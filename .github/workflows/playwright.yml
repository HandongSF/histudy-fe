name: Histudy E2E CI
on:
   push:
      branches: main
   pull_request:
      branches: ['*']
   workflow_dispatch:
jobs:
   e2e-test:
      timeout-minutes: 300
      runs-on: ubuntu-latest
      env:
         CI: true
         CAN_RUN_E2E: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
         NODE_ENV: ${{ secrets.NODE_ENV }}
         VITE_BACK_BASE_URL: ${{ secrets.VITE_BACK_BASE_URL }}
         VITE_PUBLIC_URL: ${{ secrets.VITE_PUBLIC_URL }}
         E2E_USER_SUB: test1
         E2E_MEMBER_SUB: test2
         E2E_ADMIN_SUB: test3
      steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
              node-version: lts/*
         - name: Install dependencies
           run: npm install -g pnpm@8 && pnpm install --frozen-lockfile
         - name: Run type check and build
           run: pnpm exec tsc --noEmit && pnpm build
         - name: Install Playwright Browsers
           if: env.CAN_RUN_E2E == 'true'
           run: pnpm exec playwright install --with-deps
         - name: Run Playwright tests
           if: env.CAN_RUN_E2E == 'true'
           run: pnpm exec playwright test
         - name: Skip protected E2E for fork pull requests
           if: env.CAN_RUN_E2E != 'true'
           run: echo "Fork pull requests run type checking and build only because Actions secrets are not exposed."
         - uses: actions/upload-artifact@v4
           if: ${{ !cancelled() && env.CAN_RUN_E2E == 'true' }}
           with:
              name: playwright-report
              path: playwright-report/
              retention-days: 30
